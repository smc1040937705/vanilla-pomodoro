<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟计时器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🍅 番茄钟</h1>
            <button id="settingsBtn" class="settings-btn">⚙️ 设置</button>
        </header>

        <main class="main-content">
            <section class="timer-section">
                <div id="timer-container" class="timer-container"></div>
                <div id="task-container" class="task-container"></div>
            </section>

            <section class="stats-section">
                <div id="stats-container" class="stats-grid"></div>
                <div id="chart-container" class="chart-container">
                    <h3>近7天番茄数趋势</h3>
                    <canvas id="trendChart"></canvas>
                </div>
            </section>
        </main>

        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div id="settings-form"></div>
            </div>
        </div>

        <div id="alert-modal" class="modal">
            <div class="modal-content alert-modal">
                <h2 id="alert-title">⏰ 时间到！</h2>
                <p id="alert-message"></p>
                <button id="alert-close-btn" class="btn btn-primary">知道了</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/components/ProgressRing.js"></script>
    <script src="js/components/Timer.js"></script>
    <script src="js/components/StatCard.js"></script>
    <script src="js/components/SettingsForm.js"></script>
    <script src="js/components/Chart.js"></script>
    <script src="js/components/TaskList.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
